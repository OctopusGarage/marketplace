name: Validate marketplace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:catalog
      - run: npm run check:immutability
      - run: npx playwright install --with-deps chromium
      - run: npm run test:studio
      - run: python3 scripts/build-market.py
      - run: git diff --exit-code -- site/catalog.json site/packs site/previews
